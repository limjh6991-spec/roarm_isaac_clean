version: '3.8'

# 🚀 Isaac Sim 5.1.0 Docker Configuration
# 캐시 볼륨으로 시작 시간 단축: 137초 → 5초

services:
  isaac-sim:
    image: nvcr.io/nvidia/isaac-sim:5.1.0
    container_name: isaac-sim-5.1
    runtime: nvidia
    environment:
      - ACCEPT_EULA=Y
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OMNI_USER=${USER}
      - OMNI_PASS=${USER}
    volumes:
      # 프로젝트 디렉토리 마운트
      - ./:/workspace:rw
      
      # ═══════════════════════════════════════════════════════════
      # 🔥 핵심 캐시 디렉토리 (시작 시간 단축!)
      # ═══════════════════════════════════════════════════════════
      
      # Kit 캐시 (Extension 캐시)
      - ~/.cache/isaac-sim/kit:/isaac-sim/kit/cache:rw
      
      # Omniverse 캐시
      - ~/.cache/ov:/root/.cache/ov:rw
      
      # Pip 캐시
      - ~/.cache/pip:/root/.cache/pip:rw
      
      # 🔥 GL 셰이더 캐시 (첫 부팅 느림 원인!)
      - ~/.cache/nvidia/GLCache:/root/.cache/nvidia/GLCache:rw
      
      # 🔥 CUDA 컴퓨트 캐시
      - ~/.nv/ComputeCache:/root/.nv/ComputeCache:rw
      
      # Omniverse 설정/로그
      - ~/.nvidia-omniverse:/root/.nvidia-omniverse:rw
      
      # 로컬 데이터
      - ~/.local/share/ov/data:/root/.local/share/ov/data:rw
      
      # X11 소켓 (GUI 지원)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: /bin/bash

  # Headless 모드 (GUI 없이 실행)
  isaac-sim-headless:
    image: nvcr.io/nvidia/isaac-sim:5.1.0
    container_name: isaac-sim-5.1-headless
    runtime: nvidia
    environment:
      - ACCEPT_EULA=Y
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OMNI_USER=${USER}
      - OMNI_PASS=${USER}
    volumes:
      - ./:/workspace:rw
      
      # 🔥 핵심 캐시 디렉토리 (Headless도 동일!)
      - ~/.cache/isaac-sim/kit:/isaac-sim/kit/cache:rw
      - ~/.cache/ov:/root/.cache/ov:rw
      - ~/.cache/pip:/root/.cache/pip:rw
      - ~/.cache/nvidia/GLCache:/root/.cache/nvidia/GLCache:rw
      - ~/.nv/ComputeCache:/root/.nv/ComputeCache:rw
      - ~/.nvidia-omniverse:/root/.nvidia-omniverse:rw
      - ~/.local/share/ov/data:/root/.local/share/ov/data:rw
    network_mode: host
    ipc: host
    working_dir: /workspace
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: /bin/bash

