# Vision RL Configuration
# Extends base.yaml with vision-specific settings

_extends: base.yaml

# ═══════════════════════════════════════════════════════════════
# Vision Environment Settings
# ═══════════════════════════════════════════════════════════════
env:
  episode_length_s: 15.0  # Longer for vision tasks

# ═══════════════════════════════════════════════════════════════
# Camera Settings (D405 Eye-in-Hand)
# ═══════════════════════════════════════════════════════════════
camera:
  resolution: [84, 84]
  channels: 4  # RGBA or RGB-D
  parent_link: "gripper_base"
  position: [0.0, 0.0, 0.05]
  rotation: [0.0, -30.0, 0.0]  # degrees

# ═══════════════════════════════════════════════════════════════
# Algorithm Settings (SAC recommended for VRL)
# ═══════════════════════════════════════════════════════════════
algorithm:
  name: "SAC"
  policy: "CnnPolicy"
  
  hyperparams:
    learning_rate: 0.0003
    buffer_size: 100000
    batch_size: 256
    gamma: 0.99
    tau: 0.005
    ent_coef: "auto"
    
  # NatureCNN Feature Extractor
  feature_extractor:
    type: "NatureCNN"
    features_dim: 256

# ═══════════════════════════════════════════════════════════════
# Training Settings
# ═══════════════════════════════════════════════════════════════
training:
  total_timesteps: 500000
  save_freq: 10000
  eval_freq: 5000
  n_eval_episodes: 5
  
  # Logging
  log:
    tensorboard: true
    wandb: false
    verbose: 1
